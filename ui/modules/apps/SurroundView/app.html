<div class="sv-app bngApp">
  <link type="text/css" rel="stylesheet" href="/ui/modules/apps/SurroundView/app.css" />

  <div class="sv-header">
    <div>
      <div class="sv-title">SURROUND VIEW</div>
      <div class="sv-subtitle">360° CAMERA · GPU RENDERVIEW TEST</div>
    </div>
    <div class="sv-status"><span></span> <span id="svCameraStatus">STARTING…</span></div>
  </div>

  <div id="svDebugPanel" class="sv-debug-panel">Starting persistent GPU RenderView…</div>

  <div class="sv-stage">
    <div class="sv-camera sv-front">
      <div class="sv-label">FRONT</div>
      <div class="sv-grid"></div>
    </div>

    <div class="sv-camera sv-left">
      <div class="sv-label">LEFT</div>
      <div class="sv-grid"></div>
    </div>

    <div class="sv-center">
      <div class="sv-zone sv-zone-front"></div>
      <div class="sv-zone sv-zone-left"></div>
      <div class="sv-zone sv-zone-right"></div>
      <div class="sv-zone sv-zone-rear"></div>
      <div class="sv-car">
        <div class="sv-windshield"></div>
        <div class="sv-roof"></div>
        <div class="sv-rear-glass"></div>
        <div class="sv-wheel w1"></div><div class="sv-wheel w2"></div>
        <div class="sv-wheel w3"></div><div class="sv-wheel w4"></div>
      </div>
    </div>

    <div class="sv-camera sv-right">
      <div class="sv-label">RIGHT</div>
      <div class="sv-grid"></div>
    </div>

    <div class="sv-camera sv-rear">
      <div class="sv-label">REAR · GPU WINDOW</div>
      <div class="sv-grid"></div>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:10px;line-height:1.5;opacity:.6;z-index:2;">Live rear camera now renders in the separate GPU RenderView window.<br>No PNG files are used.</div>
      <div class="sv-guide sv-guide-left"></div>
      <div class="sv-guide sv-guide-right"></div>
    </div>
  </div>

  <div class="sv-footer">
    <span>PERSISTENT GPU RENDERVIEW · ZERO SCREENSHOT RELOADS</span>
    <span>Prototype v0.5.0</span>
  </div>
</div>
